[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealdesk"
version = "0.1.0"
description = "CGM DealDesk — daily inbox triage pipeline for single-family-home deals"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "pypdf>=4.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
dealdesk = "dealdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
