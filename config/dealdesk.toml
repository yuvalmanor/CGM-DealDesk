# DealDesk runtime configuration.
#
# Sections: [inbox], [activation], [buckets], [auth] (Phase 1); [triage], [ai],
# and the [[buybox.fields]] catalog (Phase 2).

[inbox]
# The dedicated deals-only mailbox DealDesk owns and watches.
address = "deals@cgm-ventures.com"

[activation]
# Only Emails received on/after the activation cutoff are processed; older
# backlog is left untouched. An explicit `cutoff` date wins. Move it back
# deliberately to sweep older backlog. If `cutoff` is omitted, the cutoff is
# computed as (today - lookback_days).
cutoff = "2026-06-28"
lookback_days = 14

[buckets]
# The Bucket labels that mark an Email as already processed. The work-queue query
# excludes any Email carrying a *terminal* one of these. `Error` is retryable — it
# is NOT excluded, so a failed Email is folded back in and retried every run.
labels = ["Passed-BuyBox", "Needs-Human", "Rejected", "Not-A-Deal", "Error"]

[retry]
# An `Error` Email is retried on every daily run. If it is still failing once it
# is older than `escalate_after_days`, it is relabeled `Needs-Human` so a broken
# item reaches the operator instead of retrying forever. Email age stands in for a
# retry counter — there is no separate ledger.
escalate_after_days = 3

[auth]
# Name of the environment variable holding the shared Calculator service-account
# JSON key (reused, one credential for Gmail + Sheets).
credential_env = "GOOGLE_SERVICE_ACCOUNT_KEY"
# Gmail access uses domain-wide delegation: the service account impersonates the
# inbox user. Must be the deals mailbox address.
delegated_subject = "deals@cgm-ventures.com"

[triage]
# Google Sheet holding the Triage Log (per-Property system of record). Reuse the
# Calculator's spreadsheet or a sibling — one service-account auth covers both.
# Set this before the first live `dealdesk run`.
spreadsheet_id = "1KxArNSlh-g0vpj4TkXrEs2X6TS45CE_VHWFO6tXf3_M"
tab = "DEALS_TRIAGE"

[calculator]
# Downstream sink: the Calculator's DEALS_APP tab (ADR-0002). Same spreadsheet as
# the Triage Log here (the Calculator's GOOGLE_SHEET_ID), but its own tab, its own
# id key, and its own schema (owned by brrrr-calculator). DealDesk writes a
# partial Deal; the Calculator backfills the rest from its DEFAULT_DEAL and
# computes results on open.
spreadsheet_id = "1KxArNSlh-g0vpj4TkXrEs2X6TS45CE_VHWFO6tXf3_M"
tab = "DEALS_APP"

# Standing financing assumptions DealDesk carries into every fed Deal — mirror
# the Calculator's DEFAULT_DEAL. They are *marker keys* the loader requires, so
# DealDesk must write them, and with REAL values: a 0 would pass the key guard but
# silently zero out leverage and corrupt the math (ADR-0002). Update these if the
# Calculator's DEFAULT_DEAL changes.
hml_lev_pp = 69.565
refi_ltv = 65

[notify]
# Where Deal Notifications and the Daily Digest are delivered. `from` must be the
# deals mailbox (defaults to [inbox].address). Sent to the deals mailbox itself
# (send-to-self). `label` (an existing Gmail label) is applied to each sent
# message directly, so routing doesn't depend on a Gmail filter. Set `to` before
# the first live run, or notifications are skipped with a warning.
to = "deals@cgm-ventures.com"
from = "deals@cgm-ventures.com"
label = "Deal Notifications"

[ai]
# Last-resort extraction fallback (Anthropic), used only when the deterministic
# rungs can't recover the must-have fields. `model` is operator-tunable: the
# default is the most capable model; switch to a cheaper one (e.g. a Haiku) to
# cut cost once volume is understood.
model = "claude-opus-4-8"
api_key_env = "ANTHROPIC_API_KEY"

# --- Buy Box field catalog --------------------------------------------------
# Operator-set criteria: max purchase price 350k, built 1950 or newer, no
# location gate. `monthly_rent` and `arv` are both feed-optional (fed even if
# blank, filled in the Calculator).
#
# NO property_type gate (dropped 2026-07-18): recovering property_type
# deterministically was the sole reason the extraction ladder never short-
# circuited — it forced an AI call on every Email (0.0% zero-token). Dropping it
# takes must-haves down to purchase_price + year_built (both recovered by the
# generic heuristics), lifting zero-token share to ~33% on the live inbox. The
# trade-off is deliberate: occasional lots/condos leak into the Calculator, where
# the price and year gates plus the operator's own review catch them, rather than
# paying the AI to gate a type the other filters already handle. A wrong inferred
# type would be worse (a silent, terminal Reject on a fabricated fact), so type is
# not inferred — it is simply not gated.
#
# Each field carries two independent roles:
#   filter = "gate" | "none"            (does the field gate the deal?)
#   calc   = "feed-required" | "feed-optional" | "none"  (Calculator input?)
# A gate field also needs an `op` (>=, <=, >, <, ==, in, not_in) and `threshold`.
# "Must-have" extraction fields are derived from this catalog (gate + feed-required).

[[buybox.fields]]
name = "purchase_price"
filter = "gate"
op = "<="
threshold = 350000
calc = "feed-required"

[[buybox.fields]]
name = "year_built"
filter = "gate"
op = ">="
threshold = 1950
calc = "none"

[[buybox.fields]]
name = "monthly_rent"
filter = "none"
calc = "feed-optional"

[[buybox.fields]]
name = "arv"
filter = "none"
calc = "feed-optional"
